<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Task Planner – Dashboard</title>
    <meta name="description" content="Manage your tasks with priority and status tracking."/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="page-wrapper">

<!-- ══ NAVBAR ══════════════════════════════════════════════════════════════ -->
<nav class="navbar">
    <div class="container navbar-inner">
        <a href="/tasks" class="navbar-brand">
            <!-- Clipboard-check icon -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
            </svg>
            Task Planner
        </a>
        <div class="navbar-actions">
            <a href="/tasks/new" class="btn btn-white">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                     stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
                New Task
            </a>
        </div>
    </div>
</nav>

<!-- ══ MAIN ════════════════════════════════════════════════════════════════ -->
<main class="main-content">
    <div class="container">

        <!-- Page header -->
        <div class="page-header">
            <h1>Dashboard</h1>
            <p>Track, manage and prioritise your tasks </p>
        </div>

        <!-- Flash messages -->
        <div th:if="${successMsg}" class="alert alert-success">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
            <span th:text="${successMsg}"></span>
        </div>
        <div th:if="${errorMsg}" class="alert alert-danger">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a1 1 0 00.87 1.5h18.62a1 1 0 00.87-1.5L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
            <span th:text="${errorMsg}"></span>
        </div>

        <!-- ── Stats ────────────────────────────────────────────────────── -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon stat-icon-todo">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">To Do</div>
                    <div class="stat-value" th:text="${stats.todo}">0</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon stat-icon-progress">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">In Progress</div>
                    <div class="stat-value" th:text="${stats.inProgress}">0</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon stat-icon-done">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Done</div>
                    <div class="stat-value" th:text="${stats.done}">0</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon stat-icon-overdue">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a1 1 0 00.87 1.5h18.62a1 1 0 00.87-1.5L13.71 3.86a2 2 0 00-3.42 0z"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Overdue</div>
                    <div class="stat-value" th:text="${stats.overdue}">0</div>
                </div>
            </div>
        </div>

        <!-- ── Toolbar ──────────────────────────────────────────────────── -->
        <div class="toolbar">
            <form method="get" action="/tasks" id="filter-form">
                <div class="toolbar-inner">
                    <!-- Search -->
                    <div class="search-group">
                        <label class="form-label" for="search">Search by title</label>
                        <div class="search-wrapper">
                            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg"
                                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
                            </svg>
                            <input id="search" name="search" type="text" class="form-control"
                                   placeholder="Search tasks…" th:value="${search}"/>
                        </div>
                    </div>

                    <!-- Filter by Status -->
                    <div class="filter-group">
                        <div>
                            <label class="form-label" for="status">Status</label>
                            <select id="status" name="status" class="form-select"
                                    style="min-width:140px"
                                    onchange="document.getElementById('filter-form').submit()">
                                <option value="">All statuses</option>
                                <option th:each="s : ${statuses}"
                                        th:value="${s.name()}"
                                        th:text="${#strings.replace(s.name(),'_',' ')}"
                                        th:selected="${s == selStatus}">
                                </option>
                            </select>
                        </div>

                        <!-- Filter by Priority -->
                        <div>
                            <label class="form-label" for="priority">Priority</label>
                            <select id="priority" name="priority" class="form-select"
                                    style="min-width:140px"
                                    onchange="document.getElementById('filter-form').submit()">
                                <option value="">All priorities</option>
                                <option th:each="p : ${priorities}"
                                        th:value="${p.name()}"
                                        th:text="${p.name()}"
                                        th:selected="${p == selPriority}">
                                </option>
                            </select>
                        </div>

                        <!-- Buttons -->
                        <div style="display:flex; align-items:flex-end; gap:8px;">
                            <button type="submit" id="search-btn" class="btn btn-primary">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                     stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                          d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
                                </svg>
                                Search
                            </button>
                            <a href="/tasks" id="reset-btn" class="btn btn-ghost">Reset</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <!-- ── Task Table ────────────────────────────────────────────────── -->
        <div class="tasks-card">
            <div th:if="${#lists.isEmpty(tasks)}" class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                     stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                <h3>No tasks found</h3>
                <p>Try adjusting your filters or <a href="/tasks/new">create a new task</a>.</p>
            </div>

            <table th:if="${!#lists.isEmpty(tasks)}" class="tasks-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Due Date</th>
                    <th>Created</th>
                    <th>Updated</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${tasks}"
                    th:classappend="${task.overdue} ? 'overdue-row' : ''">

                    <!-- ID -->
                    <td data-label="ID">
                        <span class="uuid-chip" th:title="${task.id}" th:text="${task.id}"></span>
                    </td>

                    <!-- Title + description -->
                    <td data-label="Title">
                        <div class="task-title">
                            <span th:text="${task.title}"></span>
                        </div>
                        <div th:if="${task.description != null and !task.description.isEmpty()}"
                             class="task-desc" th:text="${task.description}"></div>
                    </td>

                    <!-- Priority -->
                    <td data-label="Priority">
                        <span th:switch="${task.priority.name()}">
                            <span th:case="'HIGH'"   class="badge badge-high">● High</span>
                            <span th:case="'MEDIUM'" class="badge badge-medium">● Medium</span>
                            <span th:case="'LOW'"    class="badge badge-low">● Low</span>
                        </span>
                    </td>

                    <!-- Status – quick-change dropdown -->
                    <td data-label="Status">
                        <form class="status-form" method="post"
                              th:action="@{/tasks/{id}/status(id=${task.id})}">
                            <select name="status" class="status-select"
                                    onchange="this.form.submit()"
                                    th:id="'status-' + ${task.id}">
                                <option th:each="s : ${statuses}"
                                        th:value="${s.name()}"
                                        th:text="${#strings.replace(s.name(),'_',' ')}"
                                        th:selected="${s == task.status}">
                                </option>
                            </select>
                        </form>
                    </td>

                    <!-- Due Date -->
                    <td data-label="Due Date">
                        <div style="display:flex; flex-direction:column; gap:4px; align-items:flex-start;">
                            <span class="date-text"
                                  th:classappend="${task.overdue} ? ' past' : ''"
                                  th:text="${#temporals.format(task.dueDate, 'dd MMM yyyy')}">
                            </span>
                            <span th:if="${task.overdue}" class="overdue-badge">Overdue</span>
                        </div>
                    </td>

                    <!-- Created At -->
                    <td data-label="Created">
                        <span class="date-text"
                              th:text="${#temporals.format(task.createdAt, 'dd MMM yyyy HH:mm')}">
                        </span>
                    </td>

                    <!-- Updated At -->
                    <td data-label="Updated">
                        <span class="date-text"
                              th:text="${#temporals.format(task.updatedAt, 'dd MMM yyyy HH:mm')}">
                        </span>
                    </td>

                    <!-- Actions -->
                    <td data-label="Actions">
                        <div class="action-cell">
                            <a th:href="@{/tasks/{id}/edit(id=${task.id})}"
                               class="btn btn-sm btn-outline"
                               th:id="'edit-' + ${task.id}">Edit</a>

                            <form method="post"
                                  th:action="@{/tasks/{id}/delete(id=${task.id})}"
                                  onsubmit="return confirm('Delete this task?')">
                                <button type="submit" class="btn btn-sm btn-danger"
                                        th:id="'delete-' + ${task.id}">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div><!-- /container -->
</main>

<!-- ══ FOOTER ══════════════════════════════════════════════════════════════ -->
<footer class="footer">
    Task Planner
</footer>

</body>
</html>
