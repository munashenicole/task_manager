server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:task_planner_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# All timestamps are stored and displayed in Africa/Harare (CAT, UTC+2, no DST).
# Overdue detection compares task due-date against LocalDate.now() using this JVM timezone.
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Harare
spring.mvc.format.date=yyyy-MM-dd

spring.thymeleaf.cache=false

logging.level.com.taskplanner=DEBUG
